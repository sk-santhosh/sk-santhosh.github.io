<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="dr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="534" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">Sequence: one on-demand deployment, end to end</text>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="85" y1="84" x2="85" y2="468"/>
    <line x1="262" y1="84" x2="262" y2="468"/>
    <line x1="455" y1="84" x2="455" y2="468"/>
    <line x1="640" y1="84" x2="640" y2="468"/>
    <line x1="785" y1="84" x2="785" y2="468"/>
    <line x1="895" y1="84" x2="895" y2="468"/>
  </g>

  <!-- participants -->
  <rect x="32" y="50" width="106" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="85" y="72" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="600">Developer</text>
  <rect x="194" y="50" width="136" height="34" rx="8" fill="#0f172a"/>
  <text x="262" y="72" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">checkout repo · CI</text>
  <rect x="379" y="50" width="152" height="34" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="455" y="72" font-size="11.5" text-anchor="middle" fill="#4338ca" font-weight="600">deploy-pipeline repo</text>
  <rect x="572" y="50" width="136" height="34" rx="8" fill="#334155"/>
  <text x="640" y="72" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">Self-hosted runner</text>
  <rect x="741" y="50" width="88" height="34" rx="8" fill="#fff1eb" stroke="#EF7B4D"/>
  <text x="785" y="72" font-size="11.5" text-anchor="middle" fill="#c2410c" font-weight="600">Argo CD</text>
  <rect x="845" y="50" width="100" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="895" y="72" font-size="11.5" text-anchor="middle" fill="#1d4ed8" font-weight="600">EKS · ns dev7</text>

  <!-- messages -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="85" y1="118" x2="260" y2="118" marker-end="url(#ds)"/>
    <path d="M262 136 h44 v26 h-42" marker-end="url(#ds)"/>
    <line x1="262" y1="190" x2="453" y2="190" marker-end="url(#ds)"/>
    <line x1="455" y1="218" x2="638" y2="218" marker-end="url(#ds)"/>
    <line x1="640" y1="246" x2="783" y2="246" marker-end="url(#ds)"/>
    <line x1="640" y1="278" x2="783" y2="278" marker-end="url(#ds)"/>
    <line x1="640" y1="306" x2="783" y2="306" marker-end="url(#ds)"/>
    <line x1="785" y1="334" x2="893" y2="334" marker-end="url(#ds)"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-dasharray="6 4">
    <line x1="895" y1="362" x2="787" y2="362" marker-end="url(#dr)"/>
    <line x1="785" y1="390" x2="642" y2="390" marker-end="url(#dr)"/>
    <line x1="640" y1="418" x2="264" y2="418" marker-end="url(#dr)"/>
    <line x1="262" y1="446" x2="87" y2="446" marker-end="url(#dr)"/>
  </g>

  <!-- labels -->
  <g font-size="8.8" fill="#334155">
    <text x="173" y="111" text-anchor="middle">workflow_dispatch · branch + env dev7</text>
    <text x="318" y="147" font-weight="600" font-size="9.5">build image · push to ECR</text>
    <text x="318" y="160" font-family="ui-monospace, monospace" fill="#64748b">tag: sha-9f2c1a-1780…</text>
    <text x="358" y="183" text-anchor="middle">uses: deploy.yml@main · service, env, tag</text>
    <text x="547" y="211" text-anchor="middle">deploy job (same run) → private runner</text>
    <text x="712" y="239" text-anchor="middle">argocd login · private endpoint</text>
    <text x="712" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5">app set checkout-dev7</text>
    <text x="712" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5">-p image.tag=sha-9f2c1a…</text>
    <text x="712" y="299" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5">app sync · app wait --health</text>
    <text x="840" y="327" text-anchor="middle" font-size="9">apply → rollout</text>
  </g>
  <g font-size="9" fill="#64748b">
    <text x="840" y="355" text-anchor="middle">healthy</text>
    <text x="712" y="383" text-anchor="middle">sync OK</text>
    <text x="451" y="411" text-anchor="middle">deploy job green · same run</text>
    <text x="173" y="439" text-anchor="middle">dev7 ready to test</text>
  </g>

  <text x="480" y="506" font-size="11" text-anchor="middle" fill="#64748b">Every microservice reuses the same deploy.yml from the pipeline repo — the deploy job runs inside the service's own pipeline run.</text>
</svg>
