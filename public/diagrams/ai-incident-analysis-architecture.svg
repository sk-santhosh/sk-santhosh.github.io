<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ii" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="ig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <marker id="is" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10 0 L0 5 L10 10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="608" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">First-level incident analysis: alert in, evidenced hypothesis out</text>

  <!-- lane 1 -->
  <rect x="24" y="46" width="912" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="66" font-size="12" fill="#475569" font-weight="600">1 · The alert lands — the bot analyses it once unprompted, then speaks only when tagged</text>
  <g text-anchor="middle">
    <rect x="44" y="78" width="124" height="38" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="106" y="102" font-size="11.5" fill="#b45309">Alertmanager</text>
    <rect x="200" y="78" width="164" height="38" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="282" y="102" font-size="11.5" fill="#6d28d9">Slack #prod-alerts</text>
    <rect x="396" y="78" width="148" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="470" y="95" font-size="11.5" fill="#1d4ed8">Bot listener</text>
    <text x="470" y="109" font-size="9.5" fill="#3b82f6">wakes on alert or @mention</text>
    <rect x="576" y="78" width="340" height="38" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="746" y="95" font-size="11.5" fill="#4338ca" font-weight="600">Temporal · signalWithStart</text>
    <text x="746" y="110" font-size="10" fill="#4338ca">running run → signal it · closed run → start a new one</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="168" y1="97" x2="196" y2="97" marker-end="url(#ia)"/>
    <line x1="364" y1="97" x2="392" y2="97" marker-end="url(#ia)"/>
    <line x1="544" y1="97" x2="572" y2="97" marker-end="url(#ia)"/>
  </g>

  <!-- lane 2 -->
  <rect x="24" y="142" width="912" height="196" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="212" y="162" font-size="12" fill="#475569" font-weight="600">2 · The investigation — a LangGraph agent on a Temporal worker · KEDA scales the pool on task-queue depth</text>

  <rect x="44" y="172" width="272" height="146" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="180" y="196" font-size="13" text-anchor="middle" fill="#6d28d9" font-weight="600">LangGraph agent</text>
  <g font-size="11" fill="#6d28d9">
    <text x="64" y="222">investigate + recall — in parallel</text>
    <text x="64" y="244">summarise the two into one hypothesis</text>
    <text x="64" y="266">judge: is every claim evidenced?</text>
    <text x="64" y="288">post the summary — or ask the thread</text>
  </g>
  <text x="64" y="308" font-size="10" fill="#8b5cf6">runs in an activity — its heap is not durable</text>

  <rect x="352" y="172" width="248" height="146" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="476" y="196" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">MCP servers · read-only</text>
  <g text-anchor="middle" font-size="11">
    <rect x="368" y="210" width="216" height="24" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="476" y="226" fill="#b45309">query_prometheus()</text>
    <rect x="368" y="240" width="216" height="24" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
    <text x="476" y="256" fill="#0e7490">query_loki()</text>
    <rect x="368" y="270" width="216" height="24" rx="6" fill="#f0fdfa" stroke="#14b8a6"/>
    <text x="476" y="286" fill="#0f766e">query_tempo()</text>
  </g>
  <text x="476" y="310" font-size="10" text-anchor="middle" fill="#3b82f6">results compacted before they enter the context</text>

  <rect x="636" y="172" width="280" height="146" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="776" y="194" font-size="12" text-anchor="middle" fill="#475569" font-weight="600">In-cluster telemetry</text>
  <g text-anchor="middle" font-size="11">
    <rect x="652" y="204" width="248" height="24" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="776" y="220" fill="#b45309">Prometheus · metrics</text>
    <rect x="652" y="232" width="248" height="24" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
    <text x="776" y="248" fill="#0e7490">Loki · logs</text>
    <rect x="652" y="260" width="248" height="24" rx="6" fill="#f0fdfa" stroke="#14b8a6"/>
    <text x="776" y="276" fill="#0f766e">Tempo · traces</text>
    <rect x="652" y="288" width="248" height="24" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="776" y="304" fill="#4338ca">Kubernetes pod events</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="316" y1="245" x2="348" y2="245" marker-end="url(#ia)"/>
    <line x1="600" y1="245" x2="632" y2="245" marker-end="url(#ia)"/>
  </g>

  <!-- lane 3: postgres -->
  <rect x="24" y="356" width="912" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="240" y="376" font-size="12" fill="#475569" font-weight="600">3 · Postgres — the only state that survives the pod and the workflow</text>
  <g text-anchor="middle">
    <rect x="44" y="390" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="144" y="410" font-size="11.5" fill="#334155" font-weight="600">agent_messages</text>
    <text x="144" y="427" font-size="10" fill="#475569">raw + compact, per row</text>
    <rect x="268" y="390" width="200" height="52" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="368" y="410" font-size="11.5" fill="#6d28d9" font-weight="600">coalesce(compact,</text>
    <text x="368" y="427" font-size="10" fill="#6d28d9">content) = the context</text>
    <rect x="492" y="390" width="200" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="592" y="410" font-size="11.5" fill="#1d4ed8" font-weight="600">incident_state</text>
    <text x="592" y="427" font-size="10" fill="#1d4ed8">window · status · rounds</text>
    <rect x="716" y="390" width="200" height="52" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="816" y="410" font-size="11.5" fill="#047857" font-weight="600">incident_threads</text>
    <text x="816" y="427" font-size="10" fill="#047857">pgvector · recall</text>
  </g>

  <line x1="144" y1="330" x2="144" y2="386" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#is)" marker-end="url(#ii)"/>
  <text x="158" y="349" font-size="10.5" fill="#4338ca">commit every loop · load on cold start</text>

  <!-- lane 4: kafka memory pipeline -->
  <rect x="24" y="478" width="912" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="498" font-size="12" fill="#475569" font-weight="600">4 · Every Slack message becomes memory — tagged or not, always</text>
  <g text-anchor="middle">
    <rect x="44" y="512" width="160" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="124" y="531" font-size="11.5" fill="#6d28d9">Thread messages</text>
    <text x="124" y="546" font-size="10" fill="#6d28d9">bot and human alike</text>
    <rect x="236" y="512" width="160" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="316" y="531" font-size="11.5" fill="#334155">Kafka topic</text>
    <text x="316" y="546" font-size="10" fill="#475569">replayable log</text>
    <rect x="428" y="512" width="228" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="542" y="531" font-size="11.5" fill="#1d4ed8">Embedder consumer</text>
    <text x="542" y="546" font-size="10" fill="#1d4ed8">re-embeds the whole thread</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="204" y1="534" x2="232" y2="534" marker-end="url(#ia)"/>
    <line x1="396" y1="534" x2="424" y2="534" marker-end="url(#ia)"/>
  </g>
  <path d="M 656 534 L 816 534 L 816 446" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#ig)"/>
  <rect x="822" y="492" width="52" height="16" fill="#f8fafc"/>
  <text x="826" y="505" font-size="10" fill="#047857">upsert</text>

  <text x="480" y="592" font-size="11" text-anchor="middle" fill="#64748b">The bot never remediates. It posts a hypothesis with its evidence — or the questions it could not answer — before an engineer has finished reading the alert.</text>
</svg>
