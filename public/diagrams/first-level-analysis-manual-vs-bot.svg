<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="958" height="608" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">The same seven steps, done twice</text>

  <!-- column headers -->
  <rect x="340" y="52" width="290" height="54" rx="9" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="485" y="74" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="600">An engineer, half awake</text>
  <text x="485" y="93" font-size="10.5" text-anchor="middle" fill="#b45309">4 systems · 3 query languages · 6 tabs</text>

  <rect x="646" y="52" width="290" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="791" y="74" font-size="12.5" text-anchor="middle" fill="#6d28d9" font-weight="600">The bot</text>
  <text x="791" y="93" font-size="10.5" text-anchor="middle" fill="#6d28d9">same systems, reached over MCP</text>

  <g font-size="11.5">
    <!-- 1 -->
    <rect x="24" y="118" width="912" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="140" font-size="12" fill="#334155" font-weight="600">1 · Read the alert, fix the time window</text>
    <text x="40" y="157" font-size="10" fill="#64748b">what service, what symptom, which fifteen minutes</text>
    <text x="485" y="149" text-anchor="middle" fill="#b45309">30s</text>
    <text x="791" y="149" text-anchor="middle" fill="#6d28d9">pinned to the incident · 0.2s</text>

    <!-- 2 -->
    <rect x="24" y="174" width="912" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="196" font-size="12" fill="#334155" font-weight="600">2 · Memory over the window</text>
    <text x="40" y="213" font-size="10" fill="#64748b">slow climb, spike, or step change?</text>
    <text x="485" y="205" text-anchor="middle" fill="#b45309">Grafana · 3 min</text>
    <text x="791" y="205" text-anchor="middle" fill="#6d28d9">query_prometheus · 1.4s</text>

    <!-- 3 -->
    <rect x="24" y="230" width="912" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="252" font-size="12" fill="#334155" font-weight="600">3 · Did anything ship?</text>
    <text x="40" y="269" font-size="10" fill="#64748b">a deploy in the window is the cheapest explanation</text>
    <text x="485" y="261" text-anchor="middle" fill="#b45309">another tab · 2 min</text>
    <text x="791" y="261" text-anchor="middle" fill="#6d28d9">query_prometheus · 0.9s</text>

    <!-- 4 -->
    <rect x="24" y="286" width="912" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="308" font-size="12" fill="#334155" font-weight="600">4 · What did the pod say before it died</text>
    <text x="40" y="325" font-size="10" fill="#64748b">412 lines, mostly the same line 198 times</text>
    <text x="485" y="317" text-anchor="middle" fill="#b45309">Loki · LogQL · 4 min</text>
    <text x="791" y="317" text-anchor="middle" fill="#6d28d9">query_loki · 2.1s</text>

    <!-- 5 -->
    <rect x="24" y="342" width="912" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="364" font-size="12" fill="#334155" font-weight="600">5 · Pod events and limits</text>
    <text x="40" y="381" font-size="10" fill="#64748b">where an OOMKill actually confesses</text>
    <text x="485" y="373" text-anchor="middle" fill="#b45309">kubectl describe · 2.5 min</text>
    <text x="791" y="373" text-anchor="middle" fill="#6d28d9">get_pod_events · 0.6s</text>

    <!-- 6 -->
    <rect x="24" y="398" width="912" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="40" y="420" font-size="12" fill="#b91c1c" font-weight="600">6 · Have we seen this before?</text>
    <text x="40" y="437" font-size="10" fill="#dc2626">the step that decides everything, and the one that always fails</text>
    <text x="485" y="429" text-anchor="middle" fill="#b91c1c">scroll Slack, give up · 2 min</text>
    <text x="791" y="429" text-anchor="middle" fill="#047857">pgvector · 40ms · in parallel</text>

    <!-- 7 -->
    <rect x="24" y="454" width="912" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="476" font-size="12" fill="#334155" font-weight="600">7 · Form a hypothesis, check it against the evidence</text>
    <text x="40" y="493" font-size="10" fill="#64748b">the sanity check a good engineer does without noticing</text>
    <text x="485" y="485" text-anchor="middle" fill="#b45309">1 min</text>
    <text x="791" y="485" text-anchor="middle" fill="#6d28d9">summarise + judge · 6s</text>
  </g>

  <!-- totals -->
  <rect x="340" y="516" width="290" height="46" rx="9" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="485" y="537" font-size="15" text-anchor="middle" fill="#b45309" font-weight="700">≈ 15 minutes</text>
  <text x="485" y="553" font-size="10" text-anchor="middle" fill="#b45309">every time, including the next time</text>

  <rect x="646" y="516" width="290" height="46" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="791" y="537" font-size="15" text-anchor="middle" fill="#6d28d9" font-weight="700">43 seconds</text>
  <text x="791" y="553" font-size="10" text-anchor="middle" fill="#6d28d9">posted before anyone opens Grafana</text>

  <text x="480" y="588" font-size="11" text-anchor="middle" fill="#64748b">Step 6 is the one worth automating. A human cannot search three years of Slack threads at 3am; a vector index can.</text>
</svg>
