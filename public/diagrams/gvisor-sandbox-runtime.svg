<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">Standard container vs gVisor sandbox</text>

  <!-- left panel: runc -->
  <rect x="24" y="56" width="436" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="242" y="82" font-size="14" text-anchor="middle" fill="#334155" font-weight="600">Standard pod — runc</text>

  <g text-anchor="middle">
    <rect x="96" y="100" width="292" height="62" rx="9" fill="#fff1f2" stroke="#f43f5e"/>
    <text x="242" y="127" font-size="13.5" fill="#be123c" font-weight="600">Application container</text>
    <text x="242" y="145" font-size="11" fill="#be123c">namespaces + cgroups only</text>

    <rect x="96" y="266" width="292" height="62" rx="9" fill="#f1f5f9" stroke="#64748b"/>
    <text x="242" y="293" font-size="13.5" fill="#334155" font-weight="600">Host Linux kernel</text>
    <text x="242" y="311" font-size="11" fill="#475569">shared by every container on the node</text>
  </g>
  <line x1="242" y1="162" x2="242" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#ga)"/>
  <text x="252" y="216" font-size="11" fill="#be123c">every syscall (~350+) hits the</text>
  <text x="252" y="231" font-size="11" fill="#be123c">real kernel directly</text>

  <!-- right panel: gVisor -->
  <rect x="500" y="56" width="436" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="718" y="82" font-size="14" text-anchor="middle" fill="#334155" font-weight="600">Sandboxed pod — gVisor (runsc)</text>

  <g text-anchor="middle">
    <rect x="572" y="100" width="292" height="48" rx="9" fill="#ecfdf5" stroke="#10b981"/>
    <text x="718" y="121" font-size="13.5" fill="#047857" font-weight="600">Application container</text>
    <text x="718" y="138" font-size="11" fill="#047857">unmodified image, no code changes</text>

    <rect x="572" y="182" width="292" height="76" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="718" y="204" font-size="13.5" fill="#1d4ed8" font-weight="600">Sentry — user-space kernel</text>
    <text x="718" y="221" font-size="11" fill="#1d4ed8">implements Linux syscalls in Go</text>
    <text x="718" y="237" font-size="11" fill="#1d4ed8">netstack: its own TCP/IP · Gofer: file access</text>

    <rect x="572" y="290" width="292" height="48" rx="9" fill="#f1f5f9" stroke="#64748b"/>
    <text x="718" y="311" font-size="13.5" fill="#334155" font-weight="600">Host Linux kernel</text>
    <text x="718" y="328" font-size="11" fill="#475569">sees only runsc, not the app</text>
  </g>
  <line x1="718" y1="148" x2="718" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#ga)"/>
  <text x="728" y="168" font-size="10.5" fill="#047857">syscalls intercepted</text>
  <line x1="718" y1="258" x2="718" y2="286" stroke="#94a3b8" stroke-width="2" marker-end="url(#ga)"/>
  <text x="728" y="277" font-size="10.5" fill="#1d4ed8">~70 filtered syscalls, seccomp-pinned</text>

  <text x="242" y="392" font-size="11.5" text-anchor="middle" fill="#64748b">one kernel bug away from the node</text>
  <text x="718" y="392" font-size="11.5" text-anchor="middle" fill="#64748b">two layers to break before reaching the host</text>
  <text x="480" y="414" font-size="11" text-anchor="middle" fill="#94a3b8">Kubernetes selects the runtime per pod via runtimeClassName: gvisor → handler: runsc</text>
</svg>
