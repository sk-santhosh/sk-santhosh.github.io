<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="378" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">Re-embed the thread, never the message on its own</text>

  <!-- slack thread -->
  <rect x="24" y="56" width="228" height="196" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="138" y="78" font-size="12.5" text-anchor="middle" fill="#6d28d9" font-weight="600">One incident thread</text>
  <g font-size="10.5">
    <rect x="40" y="90" width="196" height="26" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="52" y="107" fill="#475569">alert: OOMKilled checkout-api</text>
    <rect x="40" y="122" width="196" height="26" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="52" y="139" fill="#475569">bot: RSS climbing, no deploy</text>
    <rect x="40" y="154" width="196" height="26" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="52" y="171" fill="#475569">human: still climbing</text>
    <rect x="40" y="186" width="196" height="26" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="52" y="203" fill="#c2410c">human: it was the sidecar</text>
  </g>
  <text x="138" y="234" font-size="10" text-anchor="middle" fill="#8b5cf6">the last message changes what</text>
  <text x="138" y="246" font-size="10" text-anchor="middle" fill="#8b5cf6">all the earlier ones meant</text>

  <!-- kafka -->
  <rect x="288" y="122" width="152" height="64" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="364" y="146" font-size="12.5" text-anchor="middle" fill="#334155" font-weight="600">Kafka</text>
  <text x="364" y="164" font-size="10.5" text-anchor="middle" fill="#475569">slack.messages</text>
  <text x="364" y="178" font-size="10" text-anchor="middle" fill="#64748b">replay to rebuild</text>

  <!-- embedder -->
  <rect x="476" y="76" width="238" height="156" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="595" y="98" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="600">Embedder consumer</text>
  <g text-anchor="middle" font-size="10.5">
    <rect x="492" y="110" width="206" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="595" y="127" fill="#1d4ed8">load the whole thread</text>
    <rect x="492" y="142" width="206" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="595" y="159" fill="#1d4ed8">summarise: cause · fix · resolved</text>
    <rect x="492" y="174" width="206" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="595" y="191" fill="#1d4ed8">embed the summary</text>
  </g>
  <text x="595" y="219" font-size="10" text-anchor="middle" fill="#3b82f6">on every message, not just the last</text>

  <!-- pgvector -->
  <rect x="750" y="102" width="186" height="104" rx="9" fill="#ecfdf5" stroke="#10b981"/>
  <text x="843" y="128" font-size="12.5" text-anchor="middle" fill="#047857" font-weight="600">pgvector</text>
  <text x="843" y="148" font-size="10.5" text-anchor="middle" fill="#047857">incident_threads</text>
  <text x="843" y="166" font-size="10.5" text-anchor="middle" fill="#047857">upsert on thread_ts</text>
  <text x="843" y="188" font-size="10" text-anchor="middle" fill="#10b981">one row per incident</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="252" y1="154" x2="284" y2="154" marker-end="url(#ta)"/>
    <line x1="440" y1="154" x2="472" y2="154" marker-end="url(#ta)"/>
    <line x1="714" y1="154" x2="746" y2="154" marker-end="url(#ta)"/>
  </g>

  <!-- the store feeds the next investigation, not this thread -->
  <rect x="44" y="282" width="212" height="38" rx="9" fill="#ecfdf5" stroke="#10b981"/>
  <text x="150" y="299" font-size="11.5" text-anchor="middle" fill="#047857" font-weight="600">The next incident</text>
  <text x="150" y="313" font-size="10" text-anchor="middle" fill="#047857">its recall branch reads this row</text>
  <path d="M 843 206 L 843 301 L 264 301" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ta)"/>
  <rect x="404" y="284" width="270" height="18" fill="#ffffff"/>
  <text x="539" y="298" font-size="10.5" text-anchor="middle" fill="#047857">recall, weeks later, on a similar alert</text>

  <text x="480" y="352" font-size="11" text-anchor="middle" fill="#64748b">A thread's meaning is its arc, not the sum of its messages — so the unit of embedding is the thread, rebuilt every time it moves.</text>
</svg>
