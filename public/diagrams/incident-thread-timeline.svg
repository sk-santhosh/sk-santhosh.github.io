<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 574" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="958" height="572" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">One thread: the bot speaks twice, listens throughout</text>

  <!-- alert -->
  <rect x="24" y="52" width="576" height="56" rx="9" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="40" y="74" font-size="11" fill="#b45309" font-weight="600">03:14:02 · Alertmanager</text>
  <text x="40" y="94" font-size="12.5" fill="#92400e">OOMKilled — checkout-api, 3 restarts in 10 minutes</text>

  <!-- bot round 1 -->
  <rect x="24" y="116" width="576" height="84" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="40" y="138" font-size="11" fill="#6d28d9" font-weight="600">03:14:45 · incident-bot</text>
  <text x="40" y="157" font-size="12" fill="#5b21b6">RSS climbing ~33Mi/min from 03:02, no deploy in the window,</text>
  <text x="40" y="175" font-size="12" fill="#5b21b6">nothing similar in past incidents. I can't tell what changed.</text>
  <text x="40" y="192" font-size="12" fill="#7c3aed">Two questions… — tag me with an answer and I'll fold it in.</text>

  <!-- humans -->
  <g font-size="12" fill="#334155">
    <rect x="24" y="208" width="576" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="225" font-size="10.5" fill="#64748b">03:21 · alice</text>
    <text x="150" y="232" fill="#334155">looking</text>

    <rect x="24" y="254" width="576" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="271" font-size="10.5" fill="#64748b">03:23 · bob</text>
    <text x="150" y="278" fill="#334155">bounced it, back up for now</text>

    <rect x="24" y="300" width="576" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="317" font-size="10.5" fill="#64748b">03:31 · alice</text>
    <text x="150" y="324" fill="#334155">payments did the same thing 20 min ago</text>

    <rect x="24" y="346" width="576" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="363" font-size="10.5" fill="#64748b">06:50 · bob</text>
    <text x="150" y="370" fill="#334155">sidecar looks unhappy too</text>
  </g>

  <!-- mention -->
  <rect x="24" y="392" width="576" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="40" y="412" font-size="10.5" fill="#1d4ed8" font-weight="600">07:31 · alice</text>
  <text x="40" y="432" font-size="12.5" fill="#1e40af">@incident-bot the sidecar was OOMing too — does that change your read?</text>

  <!-- bot round 2 -->
  <rect x="24" y="452" width="576" height="66" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="40" y="473" font-size="11" fill="#6d28d9" font-weight="600">07:31:12 · incident-bot</text>
  <text x="40" y="492" font-size="12" fill="#5b21b6">That changes it. The sidecar shares the pod memory limit — the app</text>
  <text x="40" y="509" font-size="12" fill="#5b21b6">never exceeded its own budget. Evidence: … Same shape as 14 Aug.</text>

  <!-- annotation lane -->
  <rect x="624" y="52" width="312" height="148" rx="9" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="640" y="76" font-size="12" fill="#6d28d9" font-weight="600">Wakes unprompted</text>
  <text x="640" y="96" font-size="11" fill="#6d28d9">The alert is the only thing that makes</text>
  <text x="640" y="112" font-size="11" fill="#6d28d9">it speak without being asked.</text>
  <text x="640" y="136" font-size="11" fill="#7c3aed">Round 1: 6 tool calls, judge says</text>
  <text x="640" y="152" font-size="11" fill="#7c3aed">not grounded → it asks instead of</text>
  <text x="640" y="168" font-size="11" fill="#7c3aed">guessing.</text>
  <text x="640" y="185" font-size="10" fill="#a78bfa">03:45 · idle 30 min → workflow exits</text>

  <rect x="624" y="208" width="312" height="176" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="232" font-size="12" fill="#475569" font-weight="600">Silent — but recording</text>
  <text x="640" y="252" font-size="11" fill="#475569">Engineers talk to each other. The bot</text>
  <text x="640" y="268" font-size="11" fill="#475569">does not interject, summarise or</text>
  <text x="640" y="284" font-size="11" fill="#475569">correct anyone.</text>
  <text x="640" y="308" font-size="11" fill="#64748b">Every message is still written to</text>
  <text x="640" y="324" font-size="11" fill="#64748b">Postgres and embedded.</text>
  <text x="640" y="352" font-size="11" fill="#dc2626" font-weight="600">No worker pods running for 3h 46m</text>
  <text x="640" y="370" font-size="10.5" fill="#ef4444">Nothing is on fire, nothing is billed.</text>

  <rect x="624" y="392" width="312" height="126" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="640" y="416" font-size="12" fill="#1d4ed8" font-weight="600">Tagged → wakes again</text>
  <text x="640" y="436" font-size="11" fill="#1d4ed8">A new workflow run loads the whole</text>
  <text x="640" y="452" font-size="11" fill="#1d4ed8">thread in one query — all four</text>
  <text x="640" y="468" font-size="11" fill="#1d4ed8">messages it never answered are</text>
  <text x="640" y="484" font-size="11" fill="#1d4ed8">already context.</text>
  <text x="640" y="506" font-size="10.5" fill="#3b82f6">No catching up. It was listening.</text>

  <text x="480" y="552" font-size="11" text-anchor="middle" fill="#64748b">A bot that answers every message in an incident thread is a participant nobody invited. This one speaks twice and hears everything.</text>
</svg>
