<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="498" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">Two AWS accounts: one shared non-prod cluster, an isolated prod cluster</text>

  <!-- GitHub SaaS -->
  <rect x="356" y="40" width="248" height="52" rx="8" fill="#0f172a"/>
  <text x="480" y="60" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="600">GitHub · Actions (SaaS)</text>
  <text x="480" y="78" font-size="9" text-anchor="middle" fill="#94a3b8">service repos reuse deploy-pipeline's workflow</text>

  <!-- AWS org container -->
  <rect x="24" y="104" width="912" height="372" rx="12" fill="#fcfcfd" stroke="#cbd5e1"/>
  <text x="40" y="126" font-size="12" fill="#475569" font-weight="600">AWS Organisation · private networking (VPC peering / TGW)</text>

  <!-- Non-prod account -->
  <rect x="44" y="140" width="566" height="324" rx="10" fill="#f8fafc" stroke="#f59e0b"/>
  <text x="60" y="162" font-size="12.5" fill="#b45309" font-weight="700">Non-prod account (shared)</text>

  <!-- Argo CD non-prod -->
  <rect x="64" y="176" width="150" height="46" rx="8" fill="#fff1eb" stroke="#EF7B4D"/>
  <text x="139" y="196" font-size="11.5" text-anchor="middle" fill="#c2410c" font-weight="600">Argo CD</text>
  <text x="139" y="212" font-size="9" text-anchor="middle" fill="#c2410c">in-cluster · private endpoint</text>

  <!-- Runner ASG -->
  <rect x="360" y="176" width="230" height="46" rx="8" fill="#334155"/>
  <text x="475" y="196" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">Self-hosted runner ASG</text>
  <text x="475" y="212" font-size="9" text-anchor="middle" fill="#cbd5e1">EC2 + Docker · scales to zero</text>

  <!-- EKS cluster non-prod -->
  <rect x="64" y="248" width="526" height="140" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="327" y="270" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="600">EKS cluster — private API · namespace-isolated</text>
  <g font-size="10" text-anchor="middle">
    <rect x="80" y="284" width="66" height="26" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="113" y="301" fill="#1d4ed8">dev1</text>
    <rect x="154" y="284" width="66" height="26" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="187" y="301" fill="#1d4ed8">dev2</text>
    <rect x="228" y="284" width="66" height="26" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="261" y="301" fill="#1d4ed8">dev3</text>
    <rect x="302" y="284" width="84" height="26" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="344" y="301" fill="#1d4ed8">… dev20+</text>
    <rect x="394" y="284" width="112" height="26" rx="6" fill="#eef2ff" stroke="#818cf8"/><text x="450" y="301" fill="#4338ca" font-weight="600">dev0 / testing</text>
    <rect x="80" y="318" width="140" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d"/><text x="150" y="335" fill="#b45309" font-weight="600">staging</text>
  </g>
  <text x="327" y="372" font-size="9.5" text-anchor="middle" fill="#64748b">one control plane, one Argo CD, many namespaces — 20+ environments for the price of one cluster</text>

  <!-- databases non-prod -->
  <rect x="64" y="402" width="180" height="46" rx="8" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="154" y="422" font-size="11.5" text-anchor="middle" fill="#0e7490" font-weight="600">RDS · self-hosted DBs</text>
  <text x="154" y="438" font-size="9" text-anchor="middle" fill="#0e7490">private subnets</text>

  <text x="430" y="428" font-size="9.5" text-anchor="middle" fill="#64748b">blast radius: dev + staging share an account, never prod</text>

  <!-- Production account -->
  <rect x="628" y="140" width="288" height="324" rx="10" fill="#f8fafc" stroke="#f59e0b"/>
  <text x="644" y="162" font-size="12.5" fill="#b45309" font-weight="700">Production account (isolated)</text>

  <!-- Argo CD prod -->
  <rect x="648" y="176" width="150" height="46" rx="8" fill="#fff1eb" stroke="#EF7B4D"/>
  <text x="723" y="196" font-size="11.5" text-anchor="middle" fill="#c2410c" font-weight="600">Argo CD</text>
  <text x="723" y="212" font-size="9" text-anchor="middle" fill="#c2410c">in-cluster · private endpoint</text>

  <!-- EKS cluster prod -->
  <rect x="648" y="248" width="248" height="110" rx="9" fill="#ecfdf5" stroke="#10b981"/>
  <text x="772" y="270" font-size="12" text-anchor="middle" fill="#047857" font-weight="600">EKS cluster — private API</text>
  <rect x="672" y="284" width="200" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="772" y="303" font-size="11" text-anchor="middle" fill="#047857" font-weight="600">production</text>
  <text x="772" y="340" font-size="9.5" text-anchor="middle" fill="#64748b">separate IAM · separate quotas</text>

  <!-- RDS prod -->
  <rect x="648" y="402" width="150" height="46" rx="8" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="723" y="422" font-size="11.5" text-anchor="middle" fill="#0e7490" font-weight="600">RDS</text>
  <text x="723" y="438" font-size="9" text-anchor="middle" fill="#0e7490">prod data</text>

  <text x="772" y="382" font-size="9.5" text-anchor="middle" fill="#64748b">promotion in here is manual + approved</text>

  <!-- arrows (no crossings: straight, short hops) -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <!-- GitHub dispatches jobs to the runner (straight down) -->
    <line x1="480" y1="92" x2="480" y2="174" marker-end="url(#ta)"/>
    <!-- runner -> non-prod Argo CD (same row, left) -->
    <line x1="360" y1="199" x2="216" y2="199" marker-end="url(#ta)"/>
    <!-- runner -> prod Argo CD (same row, right, cross-account) -->
    <line x1="590" y1="199" x2="646" y2="199" marker-end="url(#ta)"/>
    <!-- each Argo CD -> its cluster (straight down) -->
    <line x1="139" y1="222" x2="139" y2="246" marker-end="url(#ta)"/>
    <line x1="723" y1="222" x2="723" y2="246" marker-end="url(#ta)"/>
  </g>
  <text x="492" y="134" font-size="9.5" fill="#64748b">dispatch job</text>
  <text x="288" y="190" font-size="9.5" text-anchor="middle" fill="#64748b">set tag · sync</text>
  <text x="618" y="236" font-size="8.5" text-anchor="middle" fill="#64748b">cross-account</text>
  <text x="151" y="240" font-size="8.5" fill="#64748b">sync</text>
  <text x="735" y="240" font-size="8.5" fill="#64748b">sync</text>

  <text x="480" y="490" font-size="11" text-anchor="middle" fill="#64748b">The self-hosted runner is the only path into the private cluster APIs — GitHub never talks to the clusters directly.</text>
</svg>
