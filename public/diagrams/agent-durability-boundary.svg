<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="958" height="358" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">What survives — and what you have to write down yourself</text>

  <!-- column headers -->
  <rect x="216" y="52" width="228" height="60" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="330" y="76" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">The agent's variables</text>
  <text x="330" y="94" font-size="10.5" text-anchor="middle" fill="#dc2626">messages · scratchpad · results</text>
  <text x="330" y="107" font-size="10" text-anchor="middle" fill="#ef4444">an ordinary heap on an ordinary pod</text>

  <rect x="460" y="52" width="228" height="60" rx="9" fill="#eef2ff" stroke="#6366f1"/>
  <text x="574" y="76" font-size="12.5" text-anchor="middle" fill="#4338ca" font-weight="600">Temporal event history</text>
  <text x="574" y="94" font-size="10.5" text-anchor="middle" fill="#4f46e5">workflow state · activity results</text>
  <text x="574" y="107" font-size="10" text-anchor="middle" fill="#6366f1">replayed, not snapshotted</text>

  <rect x="704" y="52" width="232" height="60" rx="9" fill="#ecfdf5" stroke="#10b981"/>
  <text x="820" y="76" font-size="12.5" text-anchor="middle" fill="#047857" font-weight="600">Rows in Postgres</text>
  <text x="820" y="94" font-size="10.5" text-anchor="middle" fill="#059669">one per message, raw + compact</text>
  <text x="820" y="107" font-size="10" text-anchor="middle" fill="#10b981">written explicitly, by you</text>

  <!-- row 1 -->
  <rect x="24" y="132" width="912" height="64" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="160" font-size="12.5" fill="#334155" font-weight="600">A pod is deleted mid-investigation</text>
  <text x="40" y="180" font-size="10.5" fill="#64748b">KEDA scales in, or the node goes away</text>
  <g text-anchor="middle" font-weight="700">
    <text x="330" y="172" font-size="22" fill="#dc2626">✗</text>
    <text x="574" y="172" font-size="22" fill="#059669">✓</text>
    <text x="820" y="172" font-size="22" fill="#059669">✓</text>
  </g>

  <!-- row 2 -->
  <rect x="24" y="208" width="912" height="64" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="236" font-size="12.5" fill="#334155" font-weight="600">The workflow goes idle and exits</text>
  <text x="40" y="256" font-size="10.5" fill="#64748b">nobody tagged the bot for 30 minutes</text>
  <g text-anchor="middle" font-weight="700">
    <text x="330" y="248" font-size="22" fill="#dc2626">✗</text>
    <text x="574" y="248" font-size="22" fill="#dc2626">✗</text>
    <text x="820" y="248" font-size="22" fill="#059669">✓</text>
  </g>

  <rect x="704" y="284" width="232" height="26" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="820" y="301" font-size="11" text-anchor="middle" fill="#047857" font-weight="600">the only column that is all ✓</text>

  <text x="480" y="338" font-size="11" text-anchor="middle" fill="#64748b">Durable execution makes the orchestration survive. It does not make the agent's memory survive — that is a table you design.</text>
</svg>
