<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="rs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="858" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#0f172a">Sequence: release and promotion, from merge to production</text>

  <!-- phase bands -->
  <rect x="24" y="100" width="912" height="212" rx="8" fill="#f8fafc"/>
  <text x="38" y="119" font-size="10.5" font-weight="700" fill="#475569">1 · INTEGRATE — TESTING (dev0)</text>
  <rect x="24" y="320" width="912" height="122" rx="8" fill="#eef2ff"/>
  <text x="38" y="339" font-size="10.5" font-weight="700" fill="#4338ca">2 · RELEASE CUT — MAIN</text>
  <rect x="24" y="450" width="912" height="178" rx="8" fill="#fffbeb"/>
  <text x="38" y="469" font-size="10.5" font-weight="700" fill="#b45309">3 · STAGING — AUTO ON PUBLISH</text>
  <rect x="24" y="636" width="912" height="172" rx="8" fill="#ecfdf5"/>
  <text x="38" y="655" font-size="10.5" font-weight="700" fill="#047857">4 · PRODUCTION — MANUAL PROMOTE</text>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="85" y1="84" x2="85" y2="814"/>
    <line x1="265" y1="84" x2="265" y2="814"/>
    <line x1="460" y1="84" x2="460" y2="814"/>
    <line x1="645" y1="84" x2="645" y2="814"/>
    <line x1="785" y1="84" x2="785" y2="814"/>
    <line x1="895" y1="84" x2="895" y2="814"/>
  </g>

  <!-- participants -->
  <rect x="30" y="50" width="110" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="85" y="72" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="600">Developer / QA</text>
  <rect x="197" y="50" width="136" height="34" rx="8" fill="#0f172a"/>
  <text x="265" y="72" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">checkout repo · CI</text>
  <rect x="384" y="50" width="152" height="34" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="460" y="72" font-size="11.5" text-anchor="middle" fill="#4338ca" font-weight="600">deploy-pipeline repo</text>
  <rect x="577" y="50" width="136" height="34" rx="8" fill="#334155"/>
  <text x="645" y="72" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="600">Self-hosted runner</text>
  <rect x="741" y="50" width="88" height="34" rx="8" fill="#fff1eb" stroke="#EF7B4D"/>
  <text x="785" y="72" font-size="11.5" text-anchor="middle" fill="#c2410c" font-weight="600">Argo CD</text>
  <rect x="845" y="50" width="100" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="895" y="72" font-size="11.5" text-anchor="middle" fill="#1d4ed8" font-weight="600">EKS namespaces</text>

  <!-- PHASE 1 -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="85" y1="140" x2="263" y2="140" marker-end="url(#rs)"/>
    <path d="M265 156 h44 v26 h-42" marker-end="url(#rs)"/>
    <line x1="265" y1="210" x2="458" y2="210" marker-end="url(#rs)"/>
    <line x1="460" y1="236" x2="643" y2="236" marker-end="url(#rs)"/>
    <line x1="645" y1="262" x2="783" y2="262" marker-end="url(#rs)"/>
    <line x1="785" y1="288" x2="893" y2="288" marker-end="url(#rs)"/>
  </g>
  <g font-size="9" fill="#334155">
    <text x="175" y="133" text-anchor="middle">merge PR · feature → testing</text>
    <text x="321" y="172">on push: build image sha-9f2c1a… → ECR</text>
    <text x="362" y="203" text-anchor="middle" font-size="8.8">uses: deploy.yml@main · dev0 · sha tag</text>
    <text x="552" y="229" text-anchor="middle">deploy job · nonprod runner</text>
    <text x="712" y="255" text-anchor="middle" font-size="8.5">set tag + sync checkout-dev0</text>
    <text x="840" y="281" text-anchor="middle">rollout ns dev0</text>
  </g>
  <text x="480" y="303" font-size="9.5" text-anchor="middle" fill="#64748b" font-style="italic">QA verifies the feature in dev0 and signs off</text>

  <!-- PHASE 2 -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="85" y1="366" x2="263" y2="366" marker-end="url(#rs)"/>
    <path d="M265 380 h44 v24 h-42" marker-end="url(#rs)"/>
    <line x1="85" y1="424" x2="263" y2="424" marker-end="url(#rs)"/>
  </g>
  <g font-size="9" fill="#334155">
    <text x="175" y="359" text-anchor="middle">merge PR · feature → main</text>
    <text x="321" y="395">release-drafter re-drafts → release-2.3.12</text>
    <text x="175" y="417" text-anchor="middle" font-weight="600" font-size="8.8">publish release → tag release-2.3.12</text>
  </g>
  <text x="175" y="436" font-size="8.5" text-anchor="middle" fill="#64748b" font-style="italic">the one deliberate human decision</text>

  <!-- PHASE 3 -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M265 482 h44 v26 h-42" marker-end="url(#rs)"/>
    <line x1="265" y1="536" x2="458" y2="536" marker-end="url(#rs)"/>
    <line x1="460" y1="562" x2="643" y2="562" marker-end="url(#rs)"/>
    <line x1="645" y1="588" x2="783" y2="588" marker-end="url(#rs)"/>
    <line x1="785" y1="614" x2="893" y2="614" marker-end="url(#rs)"/>
  </g>
  <g font-size="9" fill="#334155">
    <text x="321" y="498">on publish: build image release-2.3.12 → ECR</text>
    <text x="362" y="529" text-anchor="middle" font-size="8.8">uses: deploy.yml@main · staging · release-2.3.12</text>
    <text x="552" y="555" text-anchor="middle">deploy job · nonprod runner (auto)</text>
    <text x="712" y="581" text-anchor="middle" font-size="8.5">set tag + sync checkout-staging</text>
    <text x="840" y="607" text-anchor="middle">rollout ns staging</text>
  </g>
  <text x="480" y="624" font-size="8.5" text-anchor="middle" fill="#64748b" font-style="italic">release verified in a prod-like environment</text>

  <!-- PHASE 4 -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="85" y1="684" x2="458" y2="684" marker-end="url(#rs)"/>
    <path d="M460 698 h44 v24 h-42" marker-end="url(#rs)"/>
    <line x1="460" y1="748" x2="643" y2="748" marker-end="url(#rs)"/>
    <line x1="645" y1="778" x2="783" y2="778" marker-end="url(#rs)"/>
    <line x1="785" y1="800" x2="893" y2="800" marker-end="url(#rs)"/>
  </g>
  <g font-size="9" fill="#334155">
    <text x="272" y="677" text-anchor="middle" font-size="9.5">dispatch deploy · production · release-2.3.12</text>
    <text x="516" y="713">production gate — required reviewer approves</text>
    <text x="552" y="741" text-anchor="middle">deploy job · prod runner pool</text>
    <text x="712" y="763" text-anchor="middle" font-size="8.5">set tag + sync checkout-production</text>
    <text x="712" y="772" text-anchor="middle" font-size="8" fill="#64748b">cross-account · prod Argo CD</text>
    <text x="840" y="794" text-anchor="middle">rollout ns production</text>
  </g>

  <text x="480" y="842" font-size="11" text-anchor="middle" fill="#64748b">One shared deploy.yml — the image cut at the release is verified in staging and shipped to production, never rebuilt.</text>
</svg>
